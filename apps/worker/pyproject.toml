[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "landfall-pay-worker"
version = "0.1.0"
description = "Landfall worker package"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = ["apscheduler>=3.10", "landfall-pay-register", "landfall-pay-classifier", "landfall-pay-rules"]

[tool.setuptools.packages.find]
include = ["landfall_worker*"]
